{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-display font-bold text-ink">Add Employee</h1>
    <a href="{{ url_for('list_employees') }}" class="text-sm font-medium text-ink/70 hover:text-ink">Cancel</a>
  </div>

  <div class="bg-white rounded-lg shadow-sm border border-line p-6">
    <form method="POST" action="{{ url_for('add_employee') }}">
      
      <!-- 1. Personal Information -->
      <div>
        <h3 class="text-sm font-display font-semibold text-ink/70 uppercase tracking-wide mb-4">Personal Information</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="first_name">First Name <span class="text-rust">*</span></label>
            <input type="text" id="first_name" name="first_name" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.first_name or '' }}" required>
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="last_name">Last Name <span class="text-rust">*</span></label>
            <input type="text" id="last_name" name="last_name" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.last_name or '' }}" required>
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="email">Email <span class="text-rust">*</span></label>
            <input type="email" id="email" name="email" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.email or '' }}" required>
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="phone">Phone</label>
            <input type="text" id="phone" name="phone" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.phone or '' }}">
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="date_of_birth">Date of Birth</label>
            <input type="date" id="date_of_birth" name="date_of_birth" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.date_of_birth or '' }}">
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="gender">Gender</label>
            <select id="gender" name="gender" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent">
              <option value="" {% if not employee.gender %}selected{% endif %} disabled>Select...</option>
              {% for g in genders %}
              <option value="{{ g }}" {% if employee.gender == g %}selected{% endif %}>{{ g }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="mt-4">
          <label class="block text-sm font-semibold text-ink mb-1.5" for="national_id">National ID / NIC</label>
          <input type="text" id="national_id" name="national_id" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.national_id or '' }}">
        </div>
      </div>

      <!-- 2. Employment Details -->
      <div class="border-t border-line pt-5 mt-5">
        <h3 class="text-sm font-display font-semibold text-ink/70 uppercase tracking-wide mb-4">Employment Details</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="department">Department <span class="text-rust">*</span></label>
            <select id="department" name="department" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" required>
              <option value="" {% if not employee.department %}selected{% endif %} disabled>Select...</option>
              {% for d in departments %}
              <option value="{{ d }}" {% if employee.department == d %}selected{% endif %}>{{ d }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="position">Position <span class="text-rust">*</span></label>
            <input type="text" id="position" name="position" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.position or '' }}" required>
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="employment_type">Employment Type <span class="text-rust">*</span></label>
            <select id="employment_type" name="employment_type" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" required>
              <option value="" {% if not employee.employment_type %}selected{% endif %} disabled>Select...</option>
              {% for et in employment_types %}
              <option value="{{ et }}" {% if employee.employment_type == et %}selected{% endif %}>{{ et }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="employment_status">Employment Status <span class="text-rust">*</span></label>
            <select id="employment_status" name="employment_status" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" required>
              {% for es in employment_statuses %}
              <option value="{{ es }}" {% if (employee.employment_status == es) or (not employee.employment_status and es == 'Active') %}selected{% endif %}>{{ es }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="employee_category">Employee Category <span class="text-rust">*</span></label>
            <select id="employee_category" name="employee_category" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" required>
              <option value="" {% if not employee.employee_category %}selected{% endif %} disabled>Select...</option>
              {% for cat in employee_categories %}
              <option value="{{ cat }}" {% if employee.employee_category == cat %}selected{% endif %}>{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="mt-4">
          <label class="block text-sm font-semibold text-ink mb-1.5" for="hire_date">Hire Date <span class="text-rust">*</span></label>
          <input type="date" id="hire_date" name="hire_date" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.hire_date or '' }}" required>
        </div>
      </div>

      <!-- Leave Allocation -->
      <div class="border-t border-line pt-5 mt-5">
        <h3 class="text-sm font-display font-semibold text-ink/70 uppercase tracking-wide mb-4">Leave Allocation</h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="annual_leave_allowed">Annual Leave (days/year)</label>
            <input type="number" min="0" step="1" id="annual_leave_allowed" name="annual_leave_allowed" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.annual_leave_allowed if employee.annual_leave_allowed is not none else 14 }}">
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="casual_leave_allowed">Casual Leave (days/year)</label>
            <input type="number" min="0" step="1" id="casual_leave_allowed" name="casual_leave_allowed" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.casual_leave_allowed if employee.casual_leave_allowed is not none else 7 }}">
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="medical_leave_allowed">Medical Leave (days/year)</label>
            <input type="number" min="0" step="1" id="medical_leave_allowed" name="medical_leave_allowed" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.medical_leave_allowed if employee.medical_leave_allowed is not none else 7 }}">
          </div>
        </div>
      </div>

      <!-- 3. Compensation -->
      <div class="border-t border-line pt-5 mt-5">
        <h3 class="text-sm font-display font-semibold text-ink/70 uppercase tracking-wide mb-4">Compensation</h3>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-ink mb-1.5" for="basic_salary">Basic Salary <span class="text-rust">*</span></label>
          <input type="number" step="0.01" min="0" id="basic_salary" name="basic_salary" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.basic_salary if employee.basic_salary is not none else '' }}" required>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="housing_allowance">Housing Allowance</label>
            <input type="number" step="0.01" min="0" id="housing_allowance" name="housing_allowance" placeholder="0.00" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.housing_allowance if employee.housing_allowance is not none else '' }}">
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="transport_allowance">Transport Allowance</label>
            <input type="number" step="0.01" min="0" id="transport_allowance" name="transport_allowance" placeholder="0.00" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.transport_allowance if employee.transport_allowance is not none else '' }}">
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="medical_allowance">Medical Allowance</label>
            <input type="number" step="0.01" min="0" id="medical_allowance" name="medical_allowance" placeholder="0.00" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.medical_allowance if employee.medical_allowance is not none else '' }}">
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="other_allowance">Other Allowance</label>
            <input type="number" step="0.01" min="0" id="other_allowance" name="other_allowance" placeholder="0.00" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.other_allowance if employee.other_allowance is not none else '' }}">
          </div>
        </div>
      </div>

      <!-- 4. Bank & Payment Details -->
      <div class="border-t border-line pt-5 mt-5">
        <h3 class="text-sm font-display font-semibold text-ink/70 uppercase tracking-wide mb-4">Bank & Payment Details</h3>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-ink mb-1.5" for="payment_method">Payment Method</label>
          <select id="payment_method" name="payment_method" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent">
            {% for pm in payment_methods %}
            <option value="{{ pm }}" {% if (employee.payment_method == pm) or (not employee.payment_method and pm == 'Bank Transfer') %}selected{% endif %}>{{ pm }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="bank_name">Bank Name</label>
            <input type="text" id="bank_name" name="bank_name" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.bank_name or '' }}">
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="bank_branch">Bank Branch</label>
            <input type="text" id="bank_branch" name="bank_branch" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.bank_branch or '' }}">
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-ink mb-1.5" for="account_number">Account Number</label>
          <input type="text" id="account_number" name="account_number" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.account_number or '' }}">
        </div>
      </div>

      <!-- 5. Emergency Contact -->
      <div class="border-t border-line pt-5 mt-5">
        <h3 class="text-sm font-display font-semibold text-ink/70 uppercase tracking-wide mb-4">Emergency Contact</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="emergency_contact_name">Contact Name</label>
            <input type="text" id="emergency_contact_name" name="emergency_contact_name" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.emergency_contact_name or '' }}">
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="emergency_contact_phone">Contact Phone</label>
            <input type="text" id="emergency_contact_phone" name="emergency_contact_phone" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.emergency_contact_phone or '' }}">
          </div>
        </div>
      </div>

      <!-- 6. Tax & Statutory -->
      <div class="border-t border-line pt-5 mt-5">
        <h3 class="text-sm font-display font-semibold text-ink/70 uppercase tracking-wide mb-4">Tax & Statutory</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="tax_id">Tax ID (TIN/PAN)</label>
            <input type="text" id="tax_id" name="tax_id" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.tax_id or '' }}">
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="epf_number">EPF Number</label>
            <input type="text" id="epf_number" name="epf_number" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.epf_number or '' }}">
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="esi_number">ESI Number</label>
            <input type="text" id="esi_number" name="esi_number" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" value="{{ employee.esi_number or '' }}">
          </div>
          <div>
            <label class="block text-sm font-semibold text-ink mb-1.5" for="tax_filing_status">Tax Filing Status</label>
            <select id="tax_filing_status" name="tax_filing_status" class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent">
              <option value="" {% if not employee.tax_filing_status %}selected{% endif %} disabled>Select...</option>
              {% for tfs in tax_filing_statuses %}
              <option value="{{ tfs }}" {% if employee.tax_filing_status == tfs %}selected{% endif %}>{{ tfs }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>

      <!-- 7. Address & Location -->
      <div class="border-t border-line pt-5 mt-5">
        <h3 class="text-sm font-display font-semibold text-ink/70 uppercase tracking-wide mb-4">Address & Location</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            {% include '_location_picker.html' %}
          </div>
        </div>
      </div>

      <div class="mt-8 flex items-center gap-4">
        <button type="submit" class="bg-accent hover:bg-accent-dark text-white px-5 py-2 rounded-md text-sm font-medium transition-colors">
          Save Employee
        </button>
        <a href="{{ url_for('list_employees') }}" class="text-sm font-medium text-ink/70 hover:text-ink">Cancel</a>
      </div>

    </form>
  </div>
</div>
{% endblock %}
