{% extends 'base.html' %}
{% block title %}Login — Payroll System{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-[#E2E5EA] overflow-hidden">
        <div class="bg-[#14181F] p-8 text-center border-b border-[#2F6F63]/30">
            <h1 class="text-3xl font-display font-bold text-white tracking-tight flex items-center justify-center gap-2">
                <span class="text-xs uppercase tracking-widest text-[#2F6F63] border border-[#2F6F63] px-2 py-0.5 rounded-full">PAY &middot; SYS</span>
                Payroll System
            </h1>
            <p class="text-gray-400 mt-2 text-sm">Sign in to your account</p>
        </div>

        <div class="p-8">
            <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-[#14181F] mb-1.5" for="username">Username</label>
                    <input type="text" id="username" name="username" required
                           class="w-full rounded-md border border-[#E2E5EA] px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2F6F63]/40 focus:border-[#2F6F63]"
                           placeholder="admin, hr, or finance">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-[#14181F] mb-1.5" for="password">Password</label>
                    <input type="password" id="password" name="password" required
                           class="w-full rounded-md border border-[#E2E5EA] px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2F6F63]/40 focus:border-[#2F6F63]"
                           placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-[#2F6F63] hover:bg-[#204E45] text-white font-semibold py-2.5 rounded-md transition-colors mt-2">
                    Sign In
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-[#E2E5EA] text-center">
                <p class="text-xs text-gray-500 font-medium">Test Accounts (password123)</p>
                <div class="flex justify-center gap-4 mt-2">
                    <span class="text-xs bg-gray-100 px-2 py-1 rounded text-gray-600 border border-gray-200">admin</span>
                    <span class="text-xs bg-gray-100 px-2 py-1 rounded text-gray-600 border border-gray-200">hr</span>
                    <span class="text-xs bg-gray-100 px-2 py-1 rounded text-gray-600 border border-gray-200">finance</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
