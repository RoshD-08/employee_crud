{% extends "base.html" %}
{% block title %}Edit Employee{% endblock %}

{% block content %}

  <div class="max-w-2xl mx-auto">
    <div class="mb-6 flex items-center justify-between">
      <div>
        <a href="{{ url_for('list_employees') }}" class="text-sm text-ink/60 hover:text-ink">&larr; Back to roster</a>
        <h1 class="font-display font-bold text-2xl text-ink mt-2">Edit employee</h1>
      </div>
      <span class="font-mono text-xs text-accent-dark bg-accent-light rounded px-2 py-1 h-fit">
        EMP-{{ "%04d"|format(employee.id) }}
      </span>
    </div>

    <form method="POST" action="{{ url_for('edit_employee', employee_id=employee.id) }}" class="bg-white border border-line rounded-lg p-6 space-y-5">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="first_name" class="block text-sm font-semibold text-ink mb-1.5">First name</label>
          <input type="text" id="first_name" name="first_name" value="{{ employee.first_name or '' }}" required
                 class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" />
        </div>
        <div>
          <label for="last_name" class="block text-sm font-semibold text-ink mb-1.5">Last name</label>
          <input type="text" id="last_name" name="last_name" value="{{ employee.last_name or '' }}" required
                 class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="email" class="block text-sm font-semibold text-ink mb-1.5">Email</label>
          <input type="email" id="email" name="email" value="{{ employee.email or '' }}" required
                 class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" />
        </div>
        <div>
          <label for="phone" class="block text-sm font-semibold text-ink mb-1.5">Phone</label>
          <input type="text" id="phone" name="phone" value="{{ employee.phone or '' }}"
                 class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="department" class="block text-sm font-semibold text-ink mb-1.5">Department</label>
          <select id="department" name="department" required
                  class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent">
            {% for dept in departments %}
              <option value="{{ dept }}" {% if employee.department == dept %}selected{% endif %}>{{ dept }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label for="position" class="block text-sm font-semibold text-ink mb-1.5">Position</label>
          <input type="text" id="position" name="position" value="{{ employee.position or '' }}" required
                 class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="salary" class="block text-sm font-semibold text-ink mb-1.5">Salary</label>
          <input type="number" step="0.01" min="0" id="salary" name="salary" value="{{ employee.salary if employee.salary is not none else '' }}" required
                 class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" />
        </div>
        <div>
          <label for="hire_date" class="block text-sm font-semibold text-ink mb-1.5">Hire date</label>
          <input type="date" id="hire_date" name="hire_date" value="{{ employee.hire_date }}" required
                 class="w-full rounded-md border border-line px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent" />
        </div>
        <div class="sm:col-span-2">
          {% include "_location_picker.html" %}
        </div>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button type="submit"
                class="rounded-md bg-accent hover:bg-accent-dark transition-colors text-white text-sm font-semibold px-5 py-2.5">
          Save changes
        </button>
        <a href="{{ url_for('list_employees') }}" class="text-sm font-semibold text-ink/60 hover:text-ink px-2">
          Cancel
        </a>
      </div>

    </form>
  </div>

{% endblock %}
